<svg xmlns="http://www.w3.org/2000/svg" style="display:none">

  <symbol id="icon-menu" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="7" x2="20" y2="7"/>
      <line x1="4" y1="12" x2="20" y2="12"/>
      <line x1="4" y1="17" x2="20" y2="17"/>
    </g>
  </symbol>

  <symbol id="icon-close" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="6" y1="6" x2="18" y2="18"/>
      <line x1="18" y1="6" x2="6" y2="18"/>
    </g>
  </symbol>

  <symbol id="icon-download" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 3v11"/>
      <polyline points="7.5 10 12 14.5 16.5 10"/>
      <path d="M4.5 18.5h15"/>
    </g>
  </symbol>

  <symbol id="icon-moon" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <path d="M16.5 12.75a5.25 5.25 0 1 1-6.12-6.12 7.5 7.5 0 1 0 6.12 6.12Z"/>
    </g>
  </symbol>

  <symbol id="icon-sun" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="12" cy="12" r="4"/>
      <line x1="12" y1="1.75" x2="12" y2="4.75"/>
      <line x1="12" y1="19.25" x2="12" y2="22.25"/>
      <line x1="4.75" y1="12" x2="1.75" y2="12"/>
      <line x1="22.25" y1="12" x2="19.25" y2="12"/>
      <line x1="6.3" y1="6.3" x2="4.2" y2="4.2"/>
      <line x1="17.8" y1="17.8" x2="19.9" y2="19.9"/>
      <line x1="6.3" y1="17.7" x2="4.2" y2="19.8"/>
      <line x1="17.7" y1="6.3" x2="19.8" y2="4.2"/>
    </g>
  </symbol>

  <symbol id="icon-arrow-up" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="12" y1="19" x2="12" y2="6"/>
      <polyline points="6 12 12 6 18 12"/>
    </g>
  </symbol>

  <symbol id="icon-mail" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="5.5" width="18" height="13" rx="2"/>
      <path d="M3.5 7l8.5 6 8.5-6"/>
    </g>
  </symbol>

  <!-- "network" mark: nodes + edges — used for LinkedIn, echoes the hero's
       constellation motif (a network of connections) -->
  <symbol id="icon-network" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="7.4" y1="8" x2="16.6" y2="8"/>
      <line x1="7.8" y1="8.9" x2="11" y2="15.3"/>
      <line x1="16.2" y1="8.9" x2="13" y2="15.3"/>
      <circle cx="6" cy="7" r="2.1"/>
      <circle cx="18" cy="7" r="2.1"/>
      <circle cx="12" cy="17" r="2.1"/>
    </g>
  </symbol>

  <symbol id="icon-code" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="8.5 6 3.5 12 8.5 18"/>
      <polyline points="15.5 6 20.5 12 15.5 18"/>
    </g>
  </symbol>

  <symbol id="icon-chart" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <line x1="4" y1="20.5" x2="20" y2="20.5"/>
      <rect x="6" y="12.5" width="3" height="8"/>
      <rect x="10.5" y="8.5" width="3" height="12"/>
      <rect x="15" y="4.5" width="3" height="16"/>
    </g>
  </symbol>

  <symbol id="icon-external" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14 4.5h5.5V10"/>
      <line x1="19.5" y1="4.5" x2="10.5" y2="13.5"/>
      <path d="M17 13.5v4a2 2 0 0 1-2 2h-9a2 2 0 0 1-2-2v-9a2 2 0 0 1 2-2h4"/>
    </g>
  </symbol>

</svg>
